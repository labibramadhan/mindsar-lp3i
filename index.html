<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LP3I Brochure AR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- MindAR CSS -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Start Screen */
      #start-screen {
        position: fixed;
        inset: 0;
        background: white;
        z-index: 20;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
      }

      #start-btn {
        padding: 12px 24px;
        font-size: 18px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 20px;
      }

      /* YouTube 3D Container */
      #youtube-3d-container {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
        display: none;
      }

      #youtube-3d-container.visible {
        display: block;
      }

      #youtube-3d-wrapper {
        position: absolute;
        transform-style: preserve-3d;
        pointer-events: auto;
      }

      #youtube-3d-wrapper iframe {
        width: 640px;
        height: 360px;
        border-radius: 12px;
        border: 4px solid white;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        background: black;
      }

      #close-3d-btn {
        position: absolute;
        top: -12px;
        right: -12px;
        width: 28px;
        height: 28px;
        font-size: 14px;
        background: #ff4444;
        color: white;
        border: 2px solid white;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }

      /* Gallery Overlay */
      #gallery-overlay {
        position: fixed;
        inset: 0;
        background: rgba(8, 12, 20, 0.6);
        backdrop-filter: blur(8px);
        z-index: 11;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }

      #gallery-overlay.visible {
        display: flex;
      }

      .gallery-panel {
        width: min(960px, 92vw);
        max-height: 85vh;
        background: #ffffff;
        border-radius: 20px;
        padding: 20px 24px 24px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .gallery-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .gallery-title {
        margin: 0;
        font-family: "Poppins", system-ui, sans-serif;
        font-size: 20px;
        color: #1b1f2a;
      }

      .gallery-close {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: none;
        background: #1b1f2a;
        color: #ffffff;
        font-size: 16px;
        cursor: pointer;
      }

      .gallery-list {
        overflow-y: auto;
        padding-right: 6px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .gallery-card {
        border: 1px solid #e0e4f0;
        border-radius: 16px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: #f8f9ff;
      }

      .gallery-card h3 {
        margin: 0;
        font-family: "Poppins", system-ui, sans-serif;
        font-size: 16px;
        color: #1b1f2a;
      }

      .gallery-thumbs {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
        gap: 10px;
      }

      .gallery-thumb {
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        cursor: pointer;
        border: none;
        padding: 0;
        background: #dfe6f5;
        aspect-ratio: 4 / 3;
      }

      .gallery-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Fullscreen Viewer */
      #fullscreen-viewer {
        position: fixed;
        inset: 0;
        background: rgba(10, 10, 12, 0.9);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 12;
      }

      #fullscreen-viewer.visible {
        display: flex;
      }

      #fullscreen-image {
        max-width: 90vw;
        max-height: 85vh;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      }

      #fullscreen-close {
        position: absolute;
        top: 24px;
        right: 24px;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: none;
        background: #ffffff;
        color: #111827;
        font-size: 18px;
        cursor: pointer;
      }

      /* Detection Indicator */
      #scanning-indicator {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.5);
        color: white;
        padding: 8px 16px;
        border-radius: 20px;
        font-family: sans-serif;
        z-index: 5;
        display: none;
      }
    </style>
  </head>

  <body>
    <!-- Start Screen -->
    <div id="start-screen">
      <h1>LP3I Brochure AR</h1>
      <p>Allow camera access to start the experience.</p>
      <button id="start-btn">Start AR</button>
    </div>

    <!-- YouTube 3D Container (positioned above target) -->
    <div id="youtube-3d-container">
      <div id="youtube-3d-wrapper">
        <button id="close-3d-btn">✕</button>
        <iframe
          id="youtube-frame"
          src=""
          title="YouTube video player"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </div>
    </div>

    <!-- Gallery Overlay -->
    <div id="gallery-overlay">
      <div class="gallery-panel">
        <div class="gallery-header">
          <h2 class="gallery-title">Gallery Preview</h2>
          <button class="gallery-close" id="gallery-close">✕</button>
        </div>
        <div class="gallery-list" id="gallery-list"></div>
      </div>
    </div>

    <!-- Fullscreen Image Viewer -->
    <div id="fullscreen-viewer">
      <button id="fullscreen-close">✕</button>
      <img id="fullscreen-image" src="" alt="Gallery fullscreen" />
    </div>

    <!-- Scanning Indicator -->
    <div id="scanning-indicator">Scanning for target...</div>

    <!-- AR Scene -->
    <a-scene
      mindar-image="imageTargetSrc: targets.mind; autoStart: false; filterMinCF: 0.0001; filterBeta: 0.001;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-entity id="target-entity" mindar-image-target="targetIndex: 0">
        <!-- Invisible anchor point above target for tracking -->
        <a-entity id="youtube-anchor" position="0 0.6 0"></a-entity>
      </a-entity>
      <a-camera id="ar-camera" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
      const startScreen = document.getElementById("start-screen");
      const startBtn = document.getElementById("start-btn");
      const indicator = document.getElementById("scanning-indicator");
      const youtubeContainer = document.getElementById("youtube-3d-container");
      const youtubeWrapper = document.getElementById("youtube-3d-wrapper");
      const iframe = document.getElementById("youtube-frame");
      const closeBtn = document.getElementById("close-3d-btn");
      const galleryOverlay = document.getElementById("gallery-overlay");
      const galleryList = document.getElementById("gallery-list");
      const galleryClose = document.getElementById("gallery-close");
      const fullscreenViewer = document.getElementById("fullscreen-viewer");
      const fullscreenImage = document.getElementById("fullscreen-image");
      const fullscreenClose = document.getElementById("fullscreen-close");
      const sceneEl = document.querySelector("a-scene");
      const target = document.querySelector("[mindar-image-target]");
      const youtubeAnchor = document.getElementById("youtube-anchor");
      const arCamera = document.getElementById("ar-camera");

      let lostTimeout;
      let isTracking = false;
      let animationFrameId = null;

      let overlayConfig = null;

      // Convert 3D world position to 2D screen position
      function worldToScreen(object3D, camera, renderer) {
        const vector = new THREE.Vector3();
        object3D.getWorldPosition(vector);

        vector.project(camera);

        const widthHalf = renderer.domElement.clientWidth / 2;
        const heightHalf = renderer.domElement.clientHeight / 2;

        return {
          x: (vector.x * widthHalf) + widthHalf,
          y: -(vector.y * heightHalf) + heightHalf,
          z: vector.z
        };
      }

      // Calculate scale based on distance from camera
      function getScaleFactor(object3D, camera) {
        const objectPos = new THREE.Vector3();
        const cameraPos = new THREE.Vector3();
        
        object3D.getWorldPosition(objectPos);
        camera.getWorldPosition(cameraPos);
        
        const distance = objectPos.distanceTo(cameraPos);
        // Base scale factor - adjust as needed
        const baseScale = 800;
        return Math.max(0.5, Math.min(4, baseScale / distance));
      }

      // Update YouTube container position to follow 3D anchor
      function updateYoutubePosition() {
        if (!isTracking) return;

        const camera = arCamera.getObject3D("camera");
        const renderer = sceneEl.renderer;
        const anchorObject = youtubeAnchor.object3D;

        if (camera && renderer && anchorObject) {
          const screenPos = worldToScreen(anchorObject, camera, renderer);
          const scale = getScaleFactor(anchorObject, camera);

          // Only show if in front of camera
          if (screenPos.z < 1) {
            youtubeWrapper.style.transform = `translate(-50%, -100%) scale(${scale})`;
            youtubeWrapper.style.left = `${screenPos.x}px`;
            youtubeWrapper.style.top = `${screenPos.y}px`;
          }
        }

        animationFrameId = requestAnimationFrame(updateYoutubePosition);
      }

      function hideOverlays() {
        youtubeContainer.classList.remove("visible");
        galleryOverlay.classList.remove("visible");
        iframe.src = "";
      }

      function renderGalleryList(galleries = []) {
        galleryList.innerHTML = "";

        if (!galleries.length) {
          const empty = document.createElement("p");
          empty.textContent = "No galleries configured.";
          empty.style.fontFamily = "Poppins, system-ui, sans-serif";
          empty.style.color = "#4b5563";
          galleryList.appendChild(empty);
          return;
        }

        galleries.forEach((gallery) => {
          const card = document.createElement("div");
          card.className = "gallery-card";

          const title = document.createElement("h3");
          title.textContent = gallery.name || "Untitled";

          const thumbs = document.createElement("div");
          thumbs.className = "gallery-thumbs";

          (gallery.photos || []).forEach((photo) => {
            const button = document.createElement("button");
            button.className = "gallery-thumb";

            const img = document.createElement("img");
            img.src = photo.src;
            img.alt = `${gallery.name || "Gallery"} photo`;

            button.addEventListener("click", () => {
              fullscreenImage.src = photo.src;
              fullscreenViewer.classList.add("visible");
            });

            button.appendChild(img);
            thumbs.appendChild(button);
          });

          card.appendChild(title);
          card.appendChild(thumbs);
          galleryList.appendChild(card);
        });
      }

      function openOverlay() {
        if (!overlayConfig) return;

        const overlayType = overlayConfig.overlayType || "youtube";

        if (overlayType === "gallery") {
          renderGalleryList(overlayConfig.galleries);
          galleryOverlay.classList.add("visible");
          return;
        }

        const youtubeConfig = overlayConfig.youtube || {};
        const targetSrc = `https://www.youtube.com/embed/${youtubeConfig.id}?si=${youtubeConfig.si || ""}&autoplay=1&rel=0`;
        if (iframe.src !== targetSrc) {
          iframe.src = targetSrc;
        }
        youtubeContainer.classList.add("visible");

        if (!animationFrameId) {
          updateYoutubePosition();
        }
      }

      async function loadOverlayConfig() {
        try {
          const response = await fetch("config.json");
          overlayConfig = await response.json();

          const mindFile = overlayConfig.mindFile || "targets.mind";
          sceneEl.setAttribute(
            "mindar-image",
            `imageTargetSrc: ${mindFile}; autoStart: false; filterMinCF: 0.0001; filterBeta: 0.001;`
          );
        } catch (error) {
          console.error("Failed to load config.json", error);
        }
      }

      startBtn.addEventListener("click", () => {
        startScreen.style.display = "none";
        indicator.style.display = "block";
        sceneEl.systems["mindar-image-system"].start();
      });

      target.addEventListener("targetFound", (event) => {
        console.log("targetFound", event);
        if (lostTimeout) clearTimeout(lostTimeout);
        indicator.style.display = "none";
        isTracking = true;
        openOverlay();
      });

      target.addEventListener("targetLost", () => {
        console.log("targetLost - waiting to confirm...");
        // Debounce the lost event to prevent flickering
        lostTimeout = setTimeout(() => {
          console.log("targetLost confirmed");
          isTracking = false;
          indicator.style.display = "block";
          hideOverlays();
          
          if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
          }
        }, 2000); // 2 second delay before closing
      });

      closeBtn.addEventListener("click", () => {
        console.log("closeBtn");
        isTracking = false;
        hideOverlays();
        
        if (animationFrameId) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
        }
      });

      galleryClose.addEventListener("click", () => {
        galleryOverlay.classList.remove("visible");
      });

      fullscreenClose.addEventListener("click", () => {
        fullscreenViewer.classList.remove("visible");
        fullscreenImage.src = "";
      });

      fullscreenViewer.addEventListener("click", (event) => {
        if (event.target === fullscreenViewer) {
          fullscreenViewer.classList.remove("visible");
          fullscreenImage.src = "";
        }
      });

      loadOverlayConfig();
    </script>
  </body>
</html>
